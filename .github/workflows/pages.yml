name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Shortly after the upstream repo's 6-hourly SharePoint sync.
    - cron: "30 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest data from upstream pftk-map
        # Falls back to the committed snapshot in upstream/ if the fetch fails.
        run: |
          base=https://raw.githubusercontent.com/Presbyterians-for-the-Kingdom/pftk-map/main/data
          for f in PCUSA_Congregations.geojson seminaries.geojson; do
            if curl -fsSL "$base/$f" -o "/tmp/$f"; then mv "/tmp/$f" "upstream/$f"; else echo "::warning::Using committed $f"; fi
          done

      - name: Build compact data
        run: python3 scripts/build_data.py upstream data

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html seminary-map.html .nojekyll css js data vendor denominational-seals _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
